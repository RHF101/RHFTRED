<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RHF MT Simulator</title>
<style>
:root{--bg:#fff;--p:#f4f5f7;--t:#1a1d23;--m:#6b7280;--g:#0f9d58;--r:#d93025;--b:#dfe2e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--p:#171b22;--t:#e6e8ec;--m:#8b93a1;--g:#26a69a;--r:#ef5350;--b:#272d38}}
:root[data-theme="dark"]{--bg:#0e1116;--p:#171b22;--t:#e6e8ec;--m:#8b93a1;--g:#26a69a;--r:#ef5350;--b:#272d38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:13px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:var(--t)}
button{background:var(--p);border:1px solid var(--b);border-radius:6px;padding:6px 10px;cursor:pointer}
button.on{border-color:var(--t);font-weight:600}
input{background:var(--p);border:1px solid var(--b);border-radius:6px;padding:8px;width:100%;min-width:0;box-sizing:border-box}
.bar{display:flex;gap:6px;padding:6px;overflow-x:auto;align-items:center;border-bottom:1px solid var(--b)}
.bar>*{flex:none}
#app{display:none;flex-direction:column;height:100%}
#wrap{flex:1;min-height:180px;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#pn{max-height:42vh;overflow:auto;border-top:1px solid var(--b);padding:6px}
.row{display:flex;gap:6px;margin-bottom:6px}
.row>*{flex:1}
.buy{background:var(--g);color:#fff;border:0;font-weight:700}
.sell{background:var(--r);color:#fff;border:0;font-weight:700}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.st div{background:var(--p);border-radius:6px;padding:4px 6px}
.st small{display:block;color:var(--m);font-size:10px}
.tb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tb td,.tb th{padding:4px;text-align:right;border-bottom:1px solid var(--b);white-space:nowrap}
.tb td:first-child,.tb th:first-child{text-align:left}
.up{color:var(--g)}.dn{color:var(--r)}.m{color:var(--m)}
.ov{display:none;position:fixed;inset:0;background:var(--bg);align-items:center;justify-content:center;z-index:5;padding:16px}
#lk{inset:auto;top:env(safe-area-inset-top,0px);left:0;right:0;padding:5px 8px;background:#b3261e;color:#fff;z-index:9;gap:8px;font-size:12px;pointer-events:none}#lk button{pointer-events:auto;padding:2px 8px}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
</style></head><body>
<div id="app">
<div class="bar" id="syms"></div>
<div class="bar"><span id="tfs" style="display:flex;gap:6px"></span><button id="zi">+</button><button id="zo">&minus;</button><button id="go">&raquo;</button><span class="m" id="who"></span><button id="lo">Keluar</button></div>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="pn">
<div class="st" id="st"></div>
<div class="row"><input id="lot" type="number" step="0.01" min="0.01" value="0.10" aria-label="Lot"><input id="sl" type="number" step="any" placeholder="SL (0=off)" aria-label="SL"><input id="tp" type="number" step="any" placeholder="TP (0=off)" aria-label="TP"></div>
<div class="row"><button class="sell" id="bs"></button><button class="buy" id="bb"></button></div>
<div id="ps"></div>
<button id="rs">Reset akun</button>
</div></div>

<div class="ov" id="setup"><div class="card"><b>Sambung ke server RHF</b>
<input id="cu" placeholder="https://panel-kamu.trycloudflare.com"><input id="ck" placeholder="public key pk_...">
<button id="cs" class="buy">Simpan</button><span class="m">Disimpan hanya di browser ini.</span></div></div>

<div class="ov" id="login"><div class="card"><b>Login</b>
<input id="em" type="email" placeholder="email" autocomplete="username"><input id="pw" type="password" placeholder="password (min 6)" autocomplete="current-password">
<div class="row"><button id="li" class="buy">Masuk</button><button id="su">Daftar</button></div><button id="of">Lewati login, pakai mode offline</button><span id="er" class="dn"></span></div></div>

<div class="ov" id="lk"><span id="lkm"></span><button id="lkb" style="display:none">Coba lagi</button></div>

<script>
var $=function(i){return document.getElementById(i)};
var S={EURUSD:{d:5,c:1e5,sp:.00012,p:1.085,v:.000014},XAUUSD:{d:2,c:100,sp:.3,p:2650,v:.035},BTCUSD:{d:2,c:1,sp:15,p:65000,v:1.8}};
var TF={M1:1,M5:5,M15:15,H1:60};
var G={sym:'EURUSD',tf:1,n:80,off:0,bal:1e4,pos:[],hist:[],nid:1,C:[],P:{},mx:-1,my:-1,sig:'',uid:null,seen:0,fatal:0,lj:'',un:[],uc:null};
var LS={get:function(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
/* UBAH DI SINI kalau URL/key berganti */
var U='http://127.0.0.1:8080',K='pk_9V42PfjEUeBrVz_GOTdmU-hD3MW6uvR8',R=null,svt=0;
function show(i,v){$(i).style.display=v?'flex':'none'}
function lock(m,b){$('lkm').textContent=m;$('lkb').style.display=b?'':'none';show('lk',1)}
function bid(k){return G.P[k]||0}function ask(k){return bid(k)+S[k].sp}
function agg(tf){var a=G.C;if(tf==1)return a;var o=[],g=tf*60,c=null;a.forEach(function(x){var b=Math.floor(x.t/g)*g;if(!c||c.t!=b){c={t:b,o:x.o,h:x.h,l:x.l,c:x.c};o.push(c)}else{if(x.h>c.h)c.h=x.h;if(x.l<c.l)c.l=x.l;c.c=x.c}});return o}
function pnl(p){if(!G.P[p.sym])return 0;var cur=p.type=='buy'?bid(p.sym):ask(p.sym);return(p.type=='buy'?cur-p.px:p.px-cur)*p.lots*S[p.sym].c}
function margin(p){return p.px*p.lots*S[p.sym].c/100}
function fx(v,k){return v.toFixed(S[k||G.sym].d)}
function fm(v){return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function save(){if(!R||!G.uid)return;var o={bal:G.bal,pos:G.pos,hist:G.hist,nid:G.nid};G.lj=JSON.stringify(o);clearTimeout(svt);svt=setTimeout(function(){R.ref('users/'+G.uid).set(o).catch(function(e){lock('Gagal simpan: '+e.message)})},500)}
function openPos(type){var k=G.sym;if(!G.P[k])return;var lots=parseFloat($('lot').value);if(!(lots>0))return;var px=type=='buy'?ask(k):bid(k);
var p={id:G.nid,sym:k,type:type,lots:lots,px:px,sl:parseFloat($('sl').value)||0,tp:parseFloat($('tp').value)||0,t:Date.now()};
var eq=G.bal+G.pos.reduce(function(a,x){return a+pnl(x)},0),mg=G.pos.reduce(function(a,x){return a+margin(x)},0);
if(margin(p)>eq-mg){alert('Margin tidak cukup');return}G.nid++;G.pos.push(p);G.sig='';save();stats()}
function closePos(id,px){var i=G.pos.findIndex(function(x){return x.id==id});if(i<0)return;var p=G.pos[i],r=pnl(p);
if(px)r=(p.type=='buy'?px-p.px:p.px-px)*p.lots*S[p.sym].c;
G.bal+=r;G.hist.unshift({id:p.id,sym:p.sym,type:p.type,lots:p.lots,px:p.px,pl:r});G.hist=G.hist.slice(0,50);G.pos.splice(i,1);G.sig='';save()}
function checkSL(){G.pos.slice().forEach(function(p){if(!G.P[p.sym])return;var b=p.type=='buy',cur=b?bid(p.sym):ask(p.sym);
if(p.sl&&(b?cur<=p.sl:cur>=p.sl))closePos(p.id,p.sl);else if(p.tp&&(b?cur>=p.tp:cur<=p.tp))closePos(p.id,p.tp)})}
function stats(){var pl=G.pos.reduce(function(a,x){return a+pnl(x)},0),mg=G.pos.reduce(function(a,x){return a+margin(x)},0),eq=G.bal+pl;
$('st').innerHTML=[['Balance',fm(G.bal)],['Equity',fm(eq)],['Margin',fm(mg)],['Free',fm(eq-mg)]].map(function(x){return'<div><small>'+x[0]+'</small>'+x[1]+'</div>'}).join('');
$('bs').textContent='SELL '+(G.P[G.sym]?fx(bid(G.sym)):'-');$('bb').textContent='BUY '+(G.P[G.sym]?fx(ask(G.sym)):'-');
var sig=G.pos.map(function(x){return x.id}).join(',')+'|'+G.hist.length;
if(sig!=G.sig){G.sig=sig;var h='<table class="tb"><tr><th>#</th><th>Tipe</th><th>Lot</th><th>Harga</th><th>P/L</th><th></th></tr>';
G.pos.forEach(function(p){h+='<tr><td>'+p.sym+' '+p.id+'</td><td class="'+(p.type=='buy'?'up':'dn')+'">'+p.type+'</td><td>'+p.lots.toFixed(2)+'</td><td>'+fx(p.px,p.sym)+'</td><td id="pl'+p.id+'"></td><td><button data-c="'+p.id+'">X</button></td></tr>'});
if(!G.pos.length)h+='<tr><td colspan="6" class="m">Tidak ada posisi terbuka</td></tr>';
h+='</table><p class="m">Riwayat</p><table class="tb">';G.hist.slice(0,8).forEach(function(p){h+='<tr><td>'+p.sym+' '+p.id+'</td><td>'+p.type+'</td><td>'+p.lots.toFixed(2)+'</td><td class="'+(p.pl>=0?'up':'dn')+'">'+fm(p.pl)+'</td></tr>'});$('ps').innerHTML=h+'</table>'}
G.pos.forEach(function(p){var e=$('pl'+p.id);if(e){var v=pnl(p);e.textContent=fm(v);e.className=v>=0?'up':'dn'}})}
function nice(r){var e=Math.pow(10,Math.floor(Math.log(r)/Math.LN10)),f=r/e;return(f<1.5?1:f<3?2:f<7?5:10)*e}
function hh(t,tf){var d=new Date(t*1000),z=function(n){return(n<10?'0':'')+n};return tf>=60?z(d.getDate())+'/'+z(d.getMonth()+1)+' '+z(d.getHours())+':00':z(d.getHours())+':'+z(d.getMinutes())}
function draw(){var cv=$('cv'),w=cv.clientWidth,h=cv.clientHeight,d=window.devicePixelRatio||1;if(!w||!h)return;
if(cv.width!=Math.round(w*d)||cv.height!=Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
var x=cv.getContext('2d'),cs=getComputedStyle(document.documentElement),C=function(n){return cs.getPropertyValue(n).trim()};
x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);x.font='11px system-ui,sans-serif';x.textBaseline='middle';
var s=S[G.sym],A=agg(G.tf);if(A.length<3)return;var n=G.n,PR=70,PB=20,cw=w-PR,ch=h-PB,bw=cw/(n+3);
G.off=Math.max(0,Math.min(G.off,A.length-10));
var end=A.length-G.off,st=Math.max(0,end-n),V=A.slice(st,end),hi=-1e18,lo=1e18;
V.forEach(function(c){if(c.h>hi)hi=c.h;if(c.l<lo)lo=c.l});var pad=(hi-lo)*.08||Math.pow(10,-s.d);hi+=pad;lo-=pad;
var yy=function(p){return ch-(p-lo)/(hi-lo)*ch},xi=function(k){return cw-(end-1-k+3.5)*bw};
var step=nice((hi-lo)/6),dec=Math.min(s.d,Math.max(0,-Math.floor(Math.log(step)/Math.LN10))),k0=Math.ceil(lo/step);
x.strokeStyle=C('--b');x.fillStyle=C('--m');x.lineWidth=1;x.textAlign='left';
for(var i=k0;i*step<hi;i++){var v=i*step,y=Math.round(yy(v))+.5;x.beginPath();x.moveTo(0,y);x.lineTo(cw,y);x.stroke();x.fillText(v.toFixed(dec),cw+6,y)}
x.textAlign='center';var m=Math.max(1,Math.ceil(100/bw));
for(var k=st;k<end;k++){if((end-1-k)%m==0){var px=Math.round(xi(k))+.5;x.beginPath();x.moveTo(px,0);x.lineTo(px,ch);x.stroke();x.fillText(hh(A[k].t,G.tf),px,ch+11)}}
x.strokeStyle=C('--b');x.beginPath();x.moveTo(cw+.5,0);x.lineTo(cw+.5,h);x.moveTo(0,ch+.5);x.lineTo(w,ch+.5);x.stroke();
var up=C('--g'),dn=C('--r'),bwid=Math.max(1,Math.floor(bw*.7));
V.forEach(function(c,i){var cx=xi(st+i),wx=Math.round(cx)+.5,col=c.c>=c.o?up:dn;x.strokeStyle=x.fillStyle=col;
x.beginPath();x.moveTo(wx,Math.round(yy(c.h)));x.lineTo(wx,Math.round(yy(c.l)));x.stroke();
var y1=Math.round(yy(Math.max(c.o,c.c))),y2=Math.round(yy(Math.min(c.o,c.c)));x.fillRect(Math.round(cx-bwid/2),y1,bwid,Math.max(1,y2-y1))});
var line=function(p,col,txt,dash){if(p<lo||p>hi)return;var y=Math.round(yy(p))+.5;x.strokeStyle=col;x.setLineDash(dash);x.beginPath();x.moveTo(0,y);x.lineTo(cw,y);x.stroke();x.setLineDash([]);
if(txt){x.fillStyle=col;x.fillRect(cw,y-8,PR,16);x.fillStyle='#fff';x.textAlign='left';x.fillText(txt,cw+4,y)}};
if(G.P[G.sym]){line(bid(G.sym),dn,fx(bid(G.sym)),[4,3]);line(ask(G.sym),up,fx(ask(G.sym)),[2,4])}
G.pos.forEach(function(p){if(p.sym!=G.sym)return;line(p.px,C('--t'),null,[6,4]);if(p.sl)line(p.sl,dn,'SL',[1,3]);if(p.tp)line(p.tp,up,'TP',[1,3])});
x.textAlign='left';x.fillStyle=C('--t');x.fillText(G.sym+', '+Object.keys(TF).filter(function(q){return TF[q]==G.tf})[0],8,12);
if(G.mx>=0&&G.mx<cw&&G.my>=0&&G.my<ch){var mx=Math.round(G.mx)+.5,my=Math.round(G.my)+.5;x.strokeStyle=C('--m');x.setLineDash([3,3]);x.beginPath();x.moveTo(mx,0);x.lineTo(mx,ch);x.moveTo(0,my);x.lineTo(cw,my);x.stroke();x.setLineDash([]);
var pv=lo+(ch-G.my)/ch*(hi-lo);x.fillStyle=C('--t');x.fillRect(cw,my-8,PR,16);x.fillStyle=C('--bg');x.textAlign='left';x.fillText(pv.toFixed(s.d),cw+4,my);
var kk=Math.round(end-1-((cw-G.mx)/bw-3.5));kk=Math.max(st,Math.min(end-1,kk));var c=A[kk];
if(c){x.fillStyle=C('--t');x.textAlign='left';x.fillText('O '+fx(c.o)+'  H '+fx(c.h)+'  L '+fx(c.l)+'  C '+fx(c.c)+'  '+hh(c.t,G.tf),8,28)}}}
function mk(){$('syms').innerHTML='';Object.keys(S).forEach(function(k){var b=document.createElement('button');b.textContent=k;b.className=k==G.sym?'on':'';b.onclick=function(){G.sym=k;G.off=0;mk();subC();stats()};$('syms').appendChild(b)});
$('tfs').innerHTML='';Object.keys(TF).forEach(function(k){var b=document.createElement('button');b.textContent=k;b.className=TF[k]==G.tf?'on':'';b.onclick=function(){G.tf=TF[k];G.off=0;mk();draw()};$('tfs').appendChild(b)})}
var cv=$('cv'),drag=null;
cv.addEventListener('pointerdown',function(e){drag={x:e.clientX,o:G.off};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){var r=cv.getBoundingClientRect();G.mx=e.clientX-r.left;G.my=e.clientY-r.top;
if(drag){var bw=(cv.clientWidth-70)/(G.n+3);G.off=drag.o+Math.round((e.clientX-drag.x)/bw)}draw()});
cv.addEventListener('pointerup',function(){drag=null});
cv.addEventListener('pointerleave',function(){if(!drag){G.mx=-1;draw()}});
cv.addEventListener('wheel',function(e){e.preventDefault();G.n=Math.max(20,Math.min(300,Math.round(G.n*(e.deltaY>0?1.1:.9))));draw()},{passive:false});
$('zi').onclick=function(){G.n=Math.max(20,Math.round(G.n*.8));draw()};
$('zo').onclick=function(){G.n=Math.min(300,Math.round(G.n*1.25));draw()};
$('go').onclick=function(){G.off=0;draw()};
$('bb').onclick=function(){openPos('buy')};$('bs').onclick=function(){openPos('sell')};
$('ps').addEventListener('click',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-c');if(id){closePos(+id);stats()}});
$('rs').onclick=function(){if(confirm('Reset akun ke 10.000?')){G.bal=1e4;G.pos=[];G.hist=[];G.nid=1;G.sig='';save();stats()}};
$('lo').onclick=function(){if(G.local){G.local=0;clearInterval(lt);lt=0;show('app',0);show('login',1);return}if(R)R.auth.logout()};
$('cs').onclick=function(){U=$('cu').value.trim().replace(/\/+$/,'');K=$('ck').value.trim();if(!U||!K)return;LS.set('rhf_u',U);LS.set('rhf_k',K);boot()};
$('lkb').onclick=function(){location.reload()};
function auth(a){$('er').textContent='';R.auth[a]($('em').value.trim(),$('pw').value).catch(function(e){$('er').textContent=e.message})}
$('li').onclick=function(){auth('login')};$('su').onclick=function(){auth('signup')};
function onLive(v){if(!v||!v.p)return;G.seen=Date.now();G.P=v.p;checkSL();draw();stats()}
function onAcc(v){if(!v||typeof v.bal!='number')return;var j=JSON.stringify({bal:v.bal,pos:v.pos||[],hist:v.hist||[],nid:v.nid||1});if(j===G.lj)return;G.lj=j;G.bal=v.bal;G.pos=v.pos||[];G.hist=v.hist||[];G.nid=v.nid||1;G.sig='';stats()}
function subC(){if(G.uc)G.uc();G.uc=null;G.C=[];if(G.local){G.C=G.LC[G.sym]||[];draw();return}if(!R||!G.uid)return;G.uc=R.ref('candles/'+G.sym).on('value',function(v){var a=[];for(var k in v||{}){var c=v[k];a.push({t:+k,o:c.o,h:c.h,l:c.l,c:c.c})}a.sort(function(x,y){return x.t-y.t});G.C=a;draw()},null,function(){})}
function stopAll(){G.un.forEach(function(f){f()});G.un=[];if(G.uc)G.uc();G.uc=null}
function run(){stopAll();var er=function(e){G.fatal=1;lock('Ditolak server: '+e.message+' (cek key / Aturan)',1)};G.fatal=0;G.seen=Date.now();
G.un=[R.ref('live').on('value',onLive,null,er),R.ref('users/'+G.uid).on('value',onAcc,null,er)];subC()}
function start(){if(R)return;R=RHF.init(U,K);R.auth.onChange(function(u){if(u){G.local=0;clearInterval(lt);lt=0;G.uid=u.uid;$('who').textContent=u.email;show('login',0);show('app',1);run()}else{if(G.local)return;stopAll();G.uid=null;show('app',0);show('login',1)}})}
function boot(){show('lk',0);if(!G.uid&&!G.local)show('login',1);
if(location.protocol=='https:'&&/^http:\/\/(?!127\.0\.0\.1|localhost)/.test(U)){lock('Panel harus HTTPS (pakai tunnel), browser memblokir HTTP.',1);return}
var s=document.createElement('script');s.src=U+'/sdk.js';s.onload=start;s.onerror=function(){lock('Server belum nyambung. Mode offline tetap bisa dipakai.',1);setTimeout(boot,5000)};document.head.appendChild(s)}
setInterval(function(){if(!G.uid||G.fatal)return;if(Date.now()-G.seen>7000)lock('Server / feeder mati. Menunggu nyambung lagi...',1);else show('lk',0)},1000);
var lt=0;
function rnd(){var u=1-Math.random(),v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
function goLocal(){if(lt)return;G.local=1;G.LC={};var t0=Math.floor(Date.now()/60000)*60;
for(var k in S){var s=S[k],p=s.p,a=[];for(var i=600;i>=0;i--){var o=p,h=p,l=p;for(var j=0;j<30;j++){p+=rnd()*s.v*2;if(p>h)h=p;if(p<l)l=p}a.push({t:t0-i*60,o:o,h:h,l:l,c:p})}G.LC[k]=a;G.P[k]=p}
show('login',0);show('lk',0);show('app',1);subC();stats();lt=setInterval(ltick,1000)}
function ltick(){var m=Math.floor(Date.now()/60000)*60;for(var k in S){var s=S[k],a=G.LC[k],c=a[a.length-1],p=G.P[k]+rnd()*s.v;G.P[k]=p;if(m>c.t){a.push({t:m,o:c.c,h:Math.max(c.c,p),l:Math.min(c.c,p),c:p});if(a.length>1500)a.shift()}else{c.c=p;if(p>c.h)c.h=p;if(p<c.l)c.l=p}}G.C=G.LC[G.sym];checkSL();draw();stats()}
$('of').onclick=goLocal;
window.addEventListener('resize',draw);mk();boot();
</script></body></html>
